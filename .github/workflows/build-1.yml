name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # Locate source directly, inside train_app/, or inside any uploaded ZIP.
      - name: Find and extract Flutter source
        id: src
        shell: bash
        run: |
          set -e
          mkdir -p _src
          shopt -s nullglob
          for archive in ./*.zip; do
            echo "Extracting $archive"
            dest="_src/$(basename "${archive%.zip}")"
            mkdir -p "$dest"
            unzip -q -o "$archive" -d "$dest"
          done
          PUBSPEC=$(find . -type f -name pubspec.yaml \
            -not -path './.git/*' \
            -not -path './.dart_tool/*' \
            -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "Flutter project not found. Repository contents:"
            find . -maxdepth 4 -type f | head -100
            echo "No pubspec.yaml was found in the repository or extracted ZIP files." >&2
            exit 1
          fi
          SRC="$(dirname "$PUBSPEC")"
          echo "dir=$SRC" >> "$GITHUB_OUTPUT"
          echo "Found Flutter project at: $SRC"
          ls -la "$SRC"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          cache: true

      - name: Create Android platform files
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter create --platforms=android --project-name train_app .

      - name: Pin Gradle wrapper
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          f=android/gradle/wrapper/gradle-wrapper.properties
          test -f "$f"
          sed -i 's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip#' "$f"
          grep '^distributionUrl=' "$f"

      - name: Align Android Gradle Plugin and Kotlin versions
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        run: |
          f=android/settings.gradle
          if [ -f "$f" ]; then
            sed -i -E 's/(com\.android\.application" version ")[^"]+(" apply false)/\18.12.1\2/' "$f"
            sed -i -E 's/(org\.jetbrains\.kotlin\.android" version ")[^"]+(" apply false)/\12.2.0\2/' "$f"
          else
            f=android/settings.gradle.kts
            sed -i -E 's/(com\.android\.application" version ")[^"]+(" apply false)/\18.12.1\2/' "$f"
            sed -i -E 's/(org\.jetbrains\.kotlin\.android" version ")[^"]+(" apply false)/\12.2.0\2/' "$f"
          fi
          grep -E 'com.android.application|org.jetbrains.kotlin.android' "$f"

      - name: Set Android application id
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          f=android/app/build.gradle
          if [ -f "$f" ]; then
            sed -i 's/applicationId "[^"]*"/applicationId "ir.railpeyma.app"/' "$f"
          else
            f=android/app/build.gradle.kts
            sed -i 's/applicationId = "[^"]*"/applicationId = "ir.railpeyma.app"/' "$f"
          fi

      - name: Add INTERNET permission and app label
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$f" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$f"
          sed -i 's|android:label="[^"]*"|android:label="ریل‌پیما"|' "$f"
          if [ -d android_res ]; then
            mkdir -p android/app/src/main/res
            cp -r android_res/. android/app/src/main/res/
          fi

      - name: Get packages
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter build apk --release

      - name: Sign APK with release key
        if: env.KS_B64 != ''
        working-directory: ${{ steps.src.outputs.dir }}
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$RUNNER_TEMP/signed.apk" "$APK"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/signed.apk" | head -3
          mv "$RUNNER_TEMP/signed.apk" "$APK"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: train-app-apk
          path: ${{ steps.src.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk

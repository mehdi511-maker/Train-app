name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and locate Flutter project
        id: src
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _src
          SEARCH_ROOT=.

          # Prefer the conventional archive name. Otherwise, find a ZIP
          # in the repository that actually contains a Flutter pubspec.yaml.
          ARCHIVE=""
          if [ -f train_app.zip ]; then
            ARCHIVE="train_app.zip"
          else
            while IFS= read -r -d '' candidate; do
              if unzip -Z1 "$candidate" | grep -Eq '(^|/)pubspec\.yaml$'; then
                ARCHIVE="$candidate"
                break
              fi
            done < <(find . -maxdepth 3 -type f -name '*.zip' \
              -not -path './.git/*' -not -path './_src/*' -print0 | sort -z)
          fi

          if [ -n "$ARCHIVE" ]; then
            echo "Extracting Flutter source from: $ARCHIVE"
            unzip -q -o "$ARCHIVE" -d _src
            SEARCH_ROOT=_src
          fi

          PUBSPEC=$(find "$SEARCH_ROOT" -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -not -path '*/build/*' -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo 'pubspec.yaml not found. Put a Flutter project in the repository or add a ZIP containing pubspec.yaml.' >&2
            echo 'ZIP files found:'
            find . -maxdepth 3 -type f -name '*.zip' -not -path './.git/*' -print
            echo 'Repository files:'
            find . -maxdepth 4 -type f -not -path './.git/*' | sort | head -160
            exit 1
          fi

          SRC="$(dirname "$PUBSPEC")"
          echo "dir=$SRC" >> "$GITHUB_OUTPUT"
          echo "Flutter project: $SRC"
          test -f "$SRC/assets/timetables.json"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          cache: true

      - name: Generate Android project
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter create --platforms=android --project-name train_app .

      - name: Configure Android Gradle versions
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper=android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip#' "$wrapper"
          settings=android/settings.gradle
          if [ ! -f "$settings" ]; then settings=android/settings.gradle.kts; fi
          sed -i -E 's/(com\.android\.application" version ")[^"]+(" apply false)/\18.12.1\2/' "$settings"
          sed -i -E 's/(org\.jetbrains\.kotlin\.android" version ")[^"]+(" apply false)/\12.2.0\2/' "$settings"
          grep -E 'com.android.application|org.jetbrains.kotlin.android' "$settings"
          grep '^distributionUrl=' "$wrapper"

      - name: Set app id, label, permission and icon
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId "[^"]*"/applicationId "ir.railpeyma.app"/' android/app/build.gradle
          else
            sed -i 's/applicationId = "[^"]*"/applicationId = "ir.railpeyma.app"/' android/app/build.gradle.kts
          fi
          manifest=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$manifest" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$manifest"
          sed -i 's|android:label="[^"]*"|android:label="ریل‌پیما"|' "$manifest"
          if [ -d android_res ]; then
            mkdir -p android/app/src/main/res
            cp -r android_res/. android/app/src/main/res/
          fi

      - name: Resolve dependencies
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter pub get

      - name: Static analysis
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter analyze --no-pub || echo "::warning::Static analysis reported issues; continuing to compile so build errors are captured separately."

      - name: Build release APK
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: railpeyma-diagnostic-apk
          path: ${{ steps.src.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk

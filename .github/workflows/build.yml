name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ads:
        description: "ساخت با تبلیغ تپسل (آزمایشی)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      ADS: ${{ inputs.ads && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      # اگر train_app.zip در ریشه‌ی ریپو باشد، باز می‌شود؛ وگرنه فایل‌های ریشه استفاده می‌شوند.
      - name: Find source
        id: src
        run: |
          if [ -f train_app.zip ]; then
            unzip -q -o train_app.zip -d _src
            echo "dir=_src/train_app" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create android folder
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter create --platforms=android --org ir.railpeyma --project-name train_app .

      - name: Add INTERNET permission
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$f" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$f"

      - name: Apply app name and icon
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="ریل‌پیما"|' "$f"
          cp -r android_res/. android/app/src/main/res/
          grep -n 'android:label' "$f"
          ls android/app/src/main/res/mipmap-xxxhdpi

      - name: Apply package name and ads manifest
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          for g in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$g" ]; then
              sed -i 's|applicationId *=* *"[^"]*"|applicationId = "ir.railpeyma.app"|' "$g"
            fi
          done
          grep -n 'applicationId' android/app/build.gradle*
          grep -q 'applicationId = "ir.railpeyma.app"' android/app/build.gradle* || { echo "applicationId was not applied"; exit 1; }

      - name: Enable native Tapsell ads
        if: env.ADS == 'true'
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' "$f" || \
            sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>|' "$f"
          MA=$(find android/app/src/main -name 'MainActivity.*' | head -1)
          [ -n "$MA" ] || { echo "MainActivity not found"; exit 1; }
          PKG=$(grep -m1 '^package' "$MA" | sed -e 's/^package *//' -e 's/;.*$//' | tr -d '\r ')
          echo "MainActivity: $MA  package: $PKG"
          rm -f "$MA"
          KDIR="android/app/src/main/kotlin/${PKG//./\/}"
          JDIR="android/app/src/main/java/${PKG//./\/}"
          mkdir -p "$KDIR" "$JDIR"
          sed "s/__PKG__/$PKG/" android_native/MainActivity.kt.tpl > "$KDIR/MainActivity.kt"
          sed "s/__PKG__/$PKG/" android_native/TapsellBridge.java.tpl > "$JDIR/TapsellBridge.java"
          if [ -f android/app/build.gradle.kts ]; then
            printf '\ndependencies {\n    implementation("ir.tapsell.plus:tapsell-plus-sdk-android:2.3.2")\n}\n' >> android/app/build.gradle.kts
          else
            printf "\ndependencies {\n    implementation 'ir.tapsell.plus:tapsell-plus-sdk-android:2.3.2'\n}\n" >> android/app/build.gradle
          fi
          tail -6 android/app/build.gradle*
          find android/app/src/main -name 'MainActivity.*' -o -name 'TapsellBridge.*'

      - name: Get packages
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          EXTRA=""
          # بدون فشرده‌سازی R8 تا کلاس‌های SDK تپسل حذف نشوند
          if [ "$ADS" = "true" ]; then EXTRA="--no-shrink"; fi
          flutter build apk --release --dart-define=ADS=$ADS $EXTRA

      # اگر Secretهای کلید تعریف شده باشند، APK با کلید ثابت شما امضا می‌شود.
      - name: Sign APK with release key
        if: env.KS_B64 != ''
        working-directory: ${{ steps.src.outputs.dir }}
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$RUNNER_TEMP/signed.apk" "$APK"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/signed.apk" | head -3
          mv "$RUNNER_TEMP/signed.apk" "$APK"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: train-app-apk
          path: ${{ steps.src.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk

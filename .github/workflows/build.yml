name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # اگر train_app.zip در ریشه‌ی ریپو باشد، باز می‌شود؛ وگرنه فایل‌های ریشه استفاده می‌شوند.
      - name: Find source
        id: src
        run: |
          zip=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$zip" ]; then
            unzip -q -o "$zip" -d _src
            dir=$(find _src -maxdepth 2 -name pubspec.yaml -printf '%h\n' | head -1)
            echo "dir=${dir:-_src/train_app}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create android folder
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter create --platforms=android --project-name train_app .

      - name: Add INTERNET permission
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$f" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$f"

      - name: Apply app name and icon
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="ریل‌پیما"|' "$f"
          if [ -d android_res ]; then
            cp -r android_res/. android/app/src/main/res/
            echo "Icons copied from android_res/"
          else
            echo "android_res/ not found — using default Flutter icon"
          fi
          grep -n 'android:label' "$f"
          ls android/app/src/main/res/mipmap-xxxhdpi 2>/dev/null || echo "No custom mipmap icons"

      - name: Get packages
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.src.outputs.dir }}
        run: flutter build apk --release

      # اگر Secretهای کلید تعریف شده باشند، APK با کلید ثابت شما امضا می‌شود.
      - name: Sign APK with release key
        if: env.KS_B64 != ''
        working-directory: ${{ steps.src.outputs.dir }}
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$RUNNER_TEMP/signed.apk" "$APK"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/signed.apk" | head -3
          mv "$RUNNER_TEMP/signed.apk" "$APK"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: train-app-apk
          path: ${{ steps.src.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk

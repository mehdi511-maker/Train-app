name: Cleanup runs
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "چند اجرای آخر نگه داشته شود"
        default: "3"
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const keep = parseInt('${{ inputs.keep }}') || 0;
            const { owner, repo } = context.repo;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo, { owner, repo, per_page: 100 });
            runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const old = runs.slice(keep).filter(r => r.id !== context.runId && r.status === 'completed');
            for (const r of old) {
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: r.id });
            }
            core.info(`deleted ${old.length}`);

name: Build Android APK + Bazaar AAB/BIN

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ads:
        description: "ساخت با تبلیغ تپسل"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      ADS: ${{ inputs.ads && 'true' || 'false' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find and extract source
        id: src
        shell: bash
        run: |
          set -euo pipefail
          if [ -f train_app.zip ]; then
            mkdir -p _src
            unzip -q -o train_app.zip -d _src
            P=$(find _src -name pubspec.yaml -not -path '*/.*' -print -quit)
            [ -n "$P" ] || {
              echo "pubspec.yaml not found in train_app.zip"
              exit 1
            }
            echo "dir=$(dirname "$P")" >> "$GITHUB_OUTPUT"
          elif [ -f pubspec.yaml ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: train_app.zip or root pubspec.yaml is missing."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release key
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ] || {
            echo "Set existing GitHub secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          }

          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

          keytool -list \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$KS_PASS" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "Release keystore and alias validated."

      - name: Create Android project
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org ir.railpeyma --project-name train_app .

      - name: Add JitPack for Bazaar billing
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          android = Path("android")
          settings_candidates = [
              android / "settings.gradle.kts",
              android / "settings.gradle",
          ]
          root_candidates = [
              android / "build.gradle.kts",
              android / "build.gradle",
          ]

          settings = next((p for p in settings_candidates if p.exists()), None)
          root = next((p for p in root_candidates if p.exists()), None)

          if settings is None or root is None:
              raise SystemExit("Android Gradle settings/build file not found.")

          settings_text = settings.read_text()
          root_text = root.read_text()

          if "jitpack.io" in settings_text or "jitpack.io" in root_text:
              print("JitPack is already configured.")
              raise SystemExit(0)

          if settings.suffix == ".kts":
              settings_repo = 'maven { url = uri("https://jitpack.io") }'
          else:
              settings_repo = 'maven { url "https://jitpack.io" }'

          drm = re.search(r'\bdependencyResolutionManagement\s*\{', settings_text)
          if drm:
              repos = re.search(r'\brepositories\s*\{', settings_text[drm.end():])
              if not repos:
                  raise SystemExit(
                      "dependencyResolutionManagement exists, but its repositories block was not found."
                  )
              insert_at = drm.end() + repos.end()
              settings_text = (
                  settings_text[:insert_at]
                  + "\n        " + settings_repo
                  + settings_text[insert_at:]
              )
              settings.write_text(settings_text)
              print(f"Added JitPack to {settings}.")
          else:
              allprojects = re.search(r'\ballprojects\s*\{', root_text)
              if allprojects:
                  repos = re.search(r'\brepositories\s*\{', root_text[allprojects.end():])
              else:
                  repos = None

              if allprojects and repos:
                  insert_at = allprojects.end() + repos.end()
                  if root.suffix == ".kts":
                      repo_line = 'maven { url = uri("https://jitpack.io") }'
                  else:
                      repo_line = 'maven { url "https://jitpack.io" }'
                  root_text = (
                      root_text[:insert_at]
                      + "\n        " + repo_line
                      + root_text[insert_at:]
                  )
              else:
                  if root.suffix == ".kts":
                      root_text += (
                          '\n\nallprojects {\n'
                          '    repositories {\n'
                          '        maven { url = uri("https://jitpack.io") }\n'
                          '    }\n'
                          '}\n'
                      )
                  else:
                      root_text += (
                          '\n\nallprojects {\n'
                          '    repositories {\n'
                          '        maven { url "https://jitpack.io" }\n'
                          '    }\n'
                          '}\n'
                      )

              root.write_text(root_text)
              print(f"Added JitPack to {root}.")
          PY

      - name: Apply app identity and internet permission
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          f=android/app/src/main/AndroidManifest.xml
          test -f "$f"

          grep -q 'android.permission.INTERNET' "$f" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$f"

          sed -i 's|android:label="[^"]*"|android:label="ریل‌پیما"|' "$f"

          if [ -d android_res ]; then
            cp -r android_res/. android/app/src/main/res/
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's|applicationId *=* *"[^"]*"|applicationId = "ir.railpeyma.app"|' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i "s|applicationId[[:space:]]*['\"][^'\"]*['\"]|applicationId 'ir.railpeyma.app'|" android/app/build.gradle
          else
            echo "App Gradle file not found"
            exit 1
          fi

      - name: Configure release signing
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              p = kts
              block = '''
              signingConfigs {
                  create("bazaarRelease") {
                      storeFile = file(System.getenv("RELEASE_STORE_FILE")!!)
                      storePassword = System.getenv("KS_PASS")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASS")
                  }
              }
          '''
              s = p.read_text()

              if 'create("bazaarRelease")' not in s:
                  s, n = re.subn(
                      r'android\s*\{',
                      lambda m: m.group(0) + block,
                      s,
                      count=1
                  )
                  if n != 1:
                      raise SystemExit("Cannot add signingConfigs to Kotlin Gradle file.")

              s, n = re.subn(
                  r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                  'signingConfig = signingConfigs.getByName("bazaarRelease")',
                  s
              )

              if n == 0 and 'signingConfig = signingConfigs.getByName("bazaarRelease")' not in s:
                  raise SystemExit("Cannot configure release signing in Kotlin Gradle file.")

              p.write_text(s)

          elif groovy.exists():
              p = groovy
              block = '''
              signingConfigs {
                  bazaarRelease {
                      storeFile file(System.getenv("RELEASE_STORE_FILE"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASS")
                  }
              }
          '''
              s = p.read_text()

              if 'bazaarRelease' not in s:
                  s, n = re.subn(
                      r'android\s*\{',
                      lambda m: m.group(0) + block,
                      s,
                      count=1
                  )
                  if n != 1:
                      raise SystemExit("Cannot add signingConfigs to Groovy Gradle file.")

              s, n = re.subn(
                  r'signingConfig\s+signingConfigs\.debug',
                  'signingConfig signingConfigs.bazaarRelease',
                  s
              )

              if n == 0 and 'signingConfig signingConfigs.bazaarRelease' not in s:
                  raise SystemExit("Cannot configure release signing in Groovy Gradle file.")

              p.write_text(s)

          else:
              raise SystemExit("Android app Gradle file missing.")

          print("Release signing configured.")
          PY

      - name: Enable native Tapsell ads
        if: env.ADS == 'true'
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          f=android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' "$f" || \
            sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>|' "$f"

          MA=$(find android/app/src/main -name 'MainActivity.*' -print -quit)
          [ -n "$MA" ] || {
            echo "MainActivity not found"
            exit 1
          }

          PKG=$(grep -m1 '^package' "$MA" | sed -e 's/^package *//' -e 's/;.*$//' | tr -d '\r ')
          [ -n "$PKG" ] || {
            echo "Could not determine MainActivity package."
            exit 1
          }

          rm -f "$MA"

          KDIR="android/app/src/main/kotlin/${PKG//./\/}"
          JDIR="android/app/src/main/java/${PKG//./\/}"
          mkdir -p "$KDIR" "$JDIR"

          test -f android_native/MainActivity.kt.tpl
          test -f android_native/TapsellBridge.java.tpl

          sed "s/__PKG__/$PKG/g" android_native/MainActivity.kt.tpl > "$KDIR/MainActivity.kt"
          sed "s/__PKG__/$PKG/g" android_native/TapsellBridge.java.tpl > "$JDIR/TapsellBridge.java"

          if [ -f android/app/build.gradle.kts ]; then
            printf '\ndependencies {\n    implementation("ir.tapsell.plus:tapsell-plus-sdk-android:2.3.2")\n}\n' >> android/app/build.gradle.kts
          else
            printf "\ndependencies {\n    implementation 'ir.tapsell.plus:tapsell-plus-sdk-android:2.3.2'\n}\n" >> android/app/build.gradle
          fi

      - name: Get Flutter packages
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Build APK and AAB
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          EXTRA=()
          if [ "$ADS" = "true" ]; then
            EXTRA+=(--no-shrink)
          fi

          flutter build apk \
            --release \
            --dart-define=ADS="$ADS" \
            "${EXTRA[@]}"

          flutter build appbundle \
            --release \
            --dart-define=ADS="$ADS" \
            "${EXTRA[@]}"

      - name: Verify signatures and generate Bazaar BIN
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"

          test -s "$APK" || {
            echo "Release APK not found: $APK"
            exit 1
          }
          test -s "$AAB" || {
            echo "Release AAB not found: $AAB"
            exit 1
          }

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || {
            echo "apksigner not found in Android SDK build-tools."
            exit 1
          }

          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-cert.txt"
          jarsigner -verify "$AAB" >/dev/null

          curl --fail --location --retry 3 \
            "https://github.com/cafebazaar/bundle-signer/releases/download/v0.1.14/bundlesigner-0.1.14.jar" \
            -o "$RUNNER_TEMP/bundlesigner.jar"

          mkdir -p "$RUNNER_TEMP/bazaar-bin"

          java -jar "$RUNNER_TEMP/bundlesigner.jar" genbin -v \
            --bundle "$AAB" \
            --bin "$RUNNER_TEMP/bazaar-bin" \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KS_PASS" \
            --key-pass "env:KEY_PASS"

          BIN=$(find "$RUNNER_TEMP/bazaar-bin" -maxdepth 1 -type f -name '*.bin' -print -quit)
          [ -n "$BIN" ] && [ -s "$BIN" ] || {
            echo "BIN generation failed."
            exit 1
          }

          mkdir -p dist
          cp "$APK" dist/app-release.apk
          cp "$AAB" dist/app-release.aab
          cp "$BIN" dist/app-release.bin

          echo "Release artifacts:"
          ls -lh dist/app-release.apk dist/app-release.aab dist/app-release.bin

          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/bundlesigner.jar"

      - name: Upload APK, AAB and BIN
        uses: actions/upload-artifact@v4
        with:
          name: train-app-bazaar-release
          path: |
            ${{ steps.src.outputs.dir }}/dist/app-release.apk
            ${{ steps.src.outputs.dir }}/dist/app-release.aab
            ${{ steps.src.outputs.dir }}/dist/app-release.bin
          if-no-files-found: error
          retention-days: 14
